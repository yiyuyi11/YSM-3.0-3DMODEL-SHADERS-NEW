syntax = "proto3";

package ysm.network;

// Player model upload: request -> admission -> ordered fragments (raw attachment) -> result.

message ModelUploadRequest {
  uint64 upload_id = 1;
  string name = 2;
  uint64 total_size = 3;
  bytes sha256 = 4;
}

message ModelUploadAdmission {
  uint64 upload_id = 1;
  bool accepted = 2;
  string reason = 3;
}

message ModelUploadFragment {
  uint64 upload_id = 1;
  uint64 offset = 2;
  bool final_fragment = 3;
}

message ModelUploadResult {
  uint64 upload_id = 1;
  ModelUploadStatus status = 2;
  string message = 3;
}

enum ModelUploadStatus {
  MODEL_UPLOAD_STATUS_UNSPECIFIED = 0;
  MODEL_UPLOAD_STATUS_PUBLISHED = 1;
  MODEL_UPLOAD_STATUS_REJECTED = 2;
  MODEL_UPLOAD_STATUS_FAILED = 3;
}
