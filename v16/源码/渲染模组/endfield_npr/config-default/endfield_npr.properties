# Endfield NPR for YSM: renderer-global settings. Ramps, LUT, face SDF, overlay
# textures and material values ship inside each model (VRM extension ENDFIELD_npr).
configVersion=11	# Config format version (older files are migrated or backed up and replaced by the current defaults)
enabled=true	# Draw YSM humanoid-import models with the Endfield NPR program
outline=true	# Draw the screen-space Endfield outline shell
antiAliasing=ssaa	# Antialiasing of the close-up NPR characters (drawn after the shader pack's TAA, so otherwise aliased): ssaa = shaded per sample in a shared multisampled target (edges and shading; needs GL 4.0 or ARB_sample_shading, else msaa), msaa = shaded per pixel (edges only), off = no antialiasing for anyone
aaSamples=4	# Samples per pixel for antiAliasing (2, 4 or 8, clamped to the GPU's limits); ssaa costs about this many times a close-up's fragment shading
aaHeroSize=0.25	# A FULL character at least this tall on screen (fraction of the screen height, after any scope/spyglass zoom) is a close-up and gets antiAliasing; others within half the largest close-up's height join it (the local player on this size alone)
aaOthers=msaa	# Antialiasing of the other characters: msaa = per pixel in the same multisampled target and depth as the close-ups (a passer-by in front of a close-up occludes it correctly), off = none (drawn straight into the main target first: cheapest, aliased edges)
lodYsmDistance=0	# Beyond this many blocks from the camera a character goes back to YSM's own path (0 = never; replaces the old lodDistance, which handed characters to YSM at 48 blocks)
lodTiers=true	# Multiplayer LOD tiers by projected size and count: FULL (body, overlay layers, outline, self-shadow, AO, scene-shadow PCF, face SDF), REDUCED (body only with the depth prepass), MINIMAL (body with diffuse ramp, ambient, exposure and display transform only) (false = FULL for every character)
lodFullSize=0.10	# FULL tier from this projected height (fraction of the screen height; 0.10 = 13 blocks at FOV 70)
lodReducedSize=0.025	# REDUCED tier from this projected height; smaller characters are MINIMAL
lodMaxFull=4	# At most this many FULL characters (largest on screen first; the rest REDUCED)
lodMaxNpr=12	# At most this many FULL + REDUCED characters (largest first; the rest MINIMAL; at most 128 NPR characters in all, any beyond go to YSM's path)
lodHysteresis=0.15	# Tier/interval boundaries move by +-this fraction around the current state (and the cap ranking favours the current state by it), so characters near a boundary do not pop
animLod=true	# Animation LOD: YSM's pose extraction (bones, morphs, springs) runs every 1/2/4/8 frames by projected size, staggered per character; off-screen characters only every animLodOffscreenInterval frames; shadow/main-pass repeats of a frame's extract are skipped; NPR characters reuse their last skin between updates
animLodSizes=0.12,0.06,0.03	# Projected-height thresholds for update intervals 1 | 2 | 4 | 8 frames
animLodMaxFullRate=8	# At most this many characters update every frame (largest first; the rest at least every 2nd frame); the local player is never throttled
animLodOffscreenInterval=8	# Pose extraction interval (frames) of characters not rendered last frame; also the most frames a pose can be old when a character comes back into view
gpuPersistentBuffers=true	# Vertex storage as persistently mapped ARB_buffer_storage pages (YSM writes REDUCED/MINIMAL skins straight into GPU-visible memory, FULL skins via a CPU copy; fenced double buffers); false or no extension = glBufferSubData
gpuCoherentMapping=true	# Persistent pages mapped MAP_COHERENT (false = MAP_FLUSH_EXPLICIT with glFlushMappedBufferRange per capture)
gpuMultiDraw=true	# One glMultiDrawElementsIndirect per batched group of REDUCED/MINIMAL characters (ARB_multi_draw_indirect + ARB_base_instance); false or missing = one glDrawElementsBaseVertex per character
gpuDirectStateAccess=true	# Create and edit the mod's own framebuffers, textures, buffers and vertex arrays by name (GL 4.5 / ARB_direct_state_access: no bind-to-edit); false or missing = bind-to-edit
debugTiming=false	# Log averaged per-frame ms (frame, capture, upload, draw CPU/GPU, YSM clone draws, pose extracts) every debugTimingFrames frames
debugTimingFrames=120	# Frames per debugTiming log line
debugClones=0	# Debug crowd: draw this many extra copies of the local player's character in 5-wide rows ahead of it (each with its own LOD tier, skin and draw)
debugCloneSpacing=1.5	# Spacing of the debug copies in blocks
debugView=0	# 0 off; 1 view-space normal as colour; 2 raw N.L (grey); 3 N.L of the flat triangle normal (dFdx/dFdy); 4 r = ramp lit alpha, g = view alpha, b = rim + back light; 5 r = self-shadow Y, g = ambient occlusion, b = scene shadow X; 6 the normal-mapped shading normal as colour (1 = the mesh normal); 7 raw N.L of the normal-mapped normal; 8 surface classes: eye magenta, face yellow (eye whites included), skin orange, hair green, cloth blue, metal grey, iris texels the class map does not call eye purple (EYE by their iris rectangle), the iris disc cyan (light violet when its class came from the rectangle), catchlight texels white; the whole character half red without a class map, pale in the MINIMAL tier
debugFaceCrack=0	# Test input of faceCrackFill: cut a vertical crack this many pixels wide through every FULL character's face (0 = off)
debugDepthOffset=false	# Diagnostic: true = the 0.6.2 depth handling under a shader pack (prepassed characters drawn with a polygon offset against an exact copy of the pack depth, which let hidden surfaces such as the mouth cavity through as dots); false = no offset, the copy is pushed back by its local slope
exposure=1.0	# Final multiplier (cb1[27].y)
tonemap=true	# Apply the game's display transform to the character (ACES_modified post LUT, neutral grading); the pack's tonemap ran before this pass
tonemapExposure=1.3	# Linear exposure into the ACES_modified curve (tuned under Bliss clear daylight against ref 07: lit cheek sat 0.09-0.10 / val 0.90-0.92)
tonemapSaturation=0.93	# Saturation inside the post LUT (0.93 in the game's LutBuilder)
postSaturation=0.85	# Display-space saturation after the transform, standing in for the game's uncaptured colour grade (tuned: hair sat 0.07-0.08, body 0.07, as ref 07)
highlightSatBoost=1.0	# Weight of the highlight saturation boost (S 1495-1522; 1 = as decompiled, 0 = off)
linearColorMath=true	# Skin edge tint, ramp chroma tint and highlight saturation boost in linear colour, as the game does (false = the 0.3.x display-space mixes)
skinRampTint=0.5	# Strength of the skin ramp's colour at the light/shadow edge (the red band on skin and face): scales the ramp chroma tint of SKIN and FACE texels; 1 = as the game's ramp, 0 = neutral grey ramp, live
adaptExposure=true	# Eye adaptation like the shader pack's auto exposure: gain = (adaptReference / light level)^adaptStrength, so a sunset is not underexposed against the adapted world
adaptReference=1.337	# Own light level at clear noon under open sky (key luminance + 0.35 x ambient)
adaptStrength=0.9	# Exponent of the adaptation (fitted in Bliss: character vs grass at sunset, time 12500, as at clear noon; 0.6.2 used 1.3, which lifted her 1.5x too bright at sunset)
adaptWeather=0.0	# Share of the rain/thunder dimming the adaptation compensates (0 = none: Bliss keeps rain and thunder dark, the character darkens with the rain-dimmed key light and lightmap; 1 = 0.6.2, which lifted her 2.5-2.9x and left her 2.8-3.7x too bright against the grass)
adaptLegacy=false	# A/B switch: true = the 0.6.2 adaptation (adaptStrength 1.3, adaptWeather 1) whatever those keys say
adaptRange=0.5,8.0	# Clamp of the adaptation gain (min, max)
adaptNightMax=2.5	# Adaptation ceiling with the sun below the horizon (blends to adaptRange max over sunrise/sunset), so nights stay night-like
adaptTime=1.0	# Eye adaptation time constant in seconds: the shared light level eases toward the viewer's surroundings like the pack's smoothed auto exposure (0 = instant). A per-character, per-frame light level made running figures flicker
eyeBrightness=1.0	# Multiplier on the final colour of eye-class texels (iris and brows; the sclera is face class), after the iris matcap and before the display transform; never on the outline
eyeNightBrightness=1.0	# Extra eye multiplier at night, blended in with the sun like adaptNightMax (1 at day, this value with the sun below the horizon); 0.8 until 0.8.14 (the eyes were never eye class in game then: no class map), live
scleraBrightness=1.0	# Multiplier on the visible brightness of the eye whites (sclera: face class, so the eye* keys never reach it; also the lid line painted in the face texture), applied to the displayed colour, so 0.8 = 80 %; never on the outline; 1 = unchanged, live
scleraNightBrightness=0.9	# Extra eye-white multiplier at night, blended in with the sun like eyeNightBrightness (1 by day, this value with the sun below the horizon), e.g. 0.8 to dim the whites with the iris; 1 = unchanged, live
eyeNightGlow=0.3	# A little self-lit iris by night: this share of the iris colour (linear) is added after exposure; blended with the sun into eyeDayGlow (this value with the sun below the horizon); iris disc only, never the brows or the outline; 0 = off, live
eyeDayGlow=0.05	# Self-lit iris by day: share of the linear iris colour added after exposure by day (eyeNightGlow is the night value; blended with the sun); iris disc only; 0 = off, live
eyeShadow=0.3	# How much of the body pass's own shading the eyeball keeps (sclera and iris, not the brows): toon ramp, self-shadow and AO (the pack's sun shadow is eyeSceneShadow's); 0 = fully lit with only the eyelid shadow of the OverlayShadow eye-white card (FULL tier), 1 = as 0.8.2 (the blob-like shadow under the iris); live
eyeSceneShadow=1.0	# How much of the shader pack's sun shadow (trees, walls) the eyeball takes (sclera and iris): 1 = like the face, as the game's Eye program does (EFL_SourceEyeSceneDiffuse with SceneShadowX), so the eye whites no longer stay lit in the shade; 0 = ignored, as 0.8.12 at eyeShadow 0; live
eyeHighlightBoost=0.4	# Brightness of the eyes' catchlights (the white dots: iris-texture texels outside the iris circle, the game's highlight part): adds texel x _EyeHighLightColor x this in linear colour after exposure, scaled by how lit the catchlight already is, for the HDR headroom and bloom the game gives them; near white wherever the eye gets some light, dark in the dark (not a self-glow); 0 = off, live
eyeHighlightOverShadow=true	# Catchlights are not darkened by the eyelid shadow over the iris (OverlayShadow stencil 20): in the game their HDR _EyeHighLightColor keeps them white through it, here the overlay multiplies the finished colour and turned them grey; false = as 0.8.8, live
eyeHighlightMinPx=1.5	# Visible catchlights: each eye catchlight (the white dots: small polygons of the iris material in front of the iris) stays at least this many pixels wide. Its own pixels take the brightest catchlight texel of their footprint (YSM's atlas has no mipmaps: a sub-pixel dot showed whichever texel its pixel centre hit), and a catchlight smaller than this is painted onto the iris at this size (FULL tier: centres from the CPU skin), fading out as its own polygon reaches twice the width; 0 = off (0.8.12), live
eyeHighlightHalo=0.5	# Soft halo around each catchlight standing in for the game's bloom of its HDR light: strength x eyeHighlightBoost x _EyeHighLightColor luminance, white tinted halfway to _EyeHighLightColor, light-following like the boost (dark without light), on the iris pixels only (FULL tier); 0 = off, live
eyeHighlightHaloPx=1.0	# Radius of the catchlight halo in pixels (Gaussian beyond the dot's edge), at most 0.15 of the eye's size on screen, live
irisBrightness=1.1	# Multiplier on the iris disc's colour (like eyeBrightness, which also takes the brows: before the display transform, so 1.2 = noticeably brighter but paler, 1.5 = much brighter); not the brows, not the catchlights; by day and night (eyeNightBrightness still applies at night); 1 = unchanged, live
irisTerms=true	# Iris terms of HGRP/CharacterNPR_Eye from the model's iris material (materials.<iris>.params): the _ParallaxScale uv shift toward the view, _EyeHighLightColor outside the iris circle and _EyeScatteringColor by the iris alpha (baseAlpha map). Models without those params are unchanged
classMapUpload=true	# With a shader pack, YSM's specular texture (it carries the material class codes: eye, face, skin, hair, cloth) is uploaded by the pack's PBR loader, which only runs when YSM draws the model in the pack's gbuffer pass, which this mod replaces: it can stay empty, and then every texel is cloth (no eye keys, no face or skin shading). true = such a texture is uploaded through YSM's own toonSpecular() (the loader of the no-pack path: same texture, same image; a later load by the pack uploads the same image again); false = read as found (0.8.12), live
classFromMaterials=true	# Material class (eye, hair, skin, face, cloth) from the model package's material table (the game shader of each material: Eye, Hair, Skin, Cloth) instead of YSM's class map, which YSM only makes when the model's texture entry names a specular map (the v14 ysm.json files name none, so every texel was cloth or a skin-tone guess: no eye keys, no face SDF). The face texture, which face_01 shares with the brows, keeps the class map, or without one: skin tones face, the rest eye-white rules; false = 0.8.12, live
browThroughHair=true	# Brows (and iris) show through the bangs where the hair's _HairBrowMask allows it (_DrawUnderBrow = 1; FULL tier): the eye-material quads are drawn again over hair texels with mask.r < _HairBrowMaskThreshold. Models without a browMask map are unchanged
browRevealDepth=0.04	# How far behind the masked bangs (blocks) a brow may lie and still show through them; Pelica's bangs sit 6-37 mm in front of her brows across views (tools/eyebrow_eval.py)
sceneShadow=true	# Receive the shader pack's sun shadows (trees, walls, overhangs) as Endfield's scene shadow X (needs Oculus/Iris with a shadow map)
sceneShadowStrength=0.5	# X = lerp(1, shadow map, strength) (EFL_SourceSceneShadowX; the game's per-scene value is not captured). Tuned in Bliss at noon under a 7x7 roof: body -40% (0.85 gave -62%, 0.6 -44%)
sceneShadowAmbient=0.85	# Ambient left in the pack's sun shadow under open sky (1 = the sky-light ambient as in the open; the lightmap does not see the canopy)
sceneShadowSelfDistance=1.0	# Occluders closer than this (blocks, toward the sun) are the character herself and are ignored (her own shadow is the self-shadow map)
sceneShadowSoftness=1.5	# 3x3 PCF tap spacing in shadow-map texels
sceneShadowDistort=1.8,0.04,0.61,6.0	# Pack shadow-map distortion k, d0, d1, z divisor (Bliss lib/Shadow_Params.glsl + shadow.vsh at shadowDistance 128)
selfShadow=true	# Character self-shadow Y (hair on face, arms on body) from her own shadow map along the shading light, as Endfield's character shadow atlas
selfShadowResolution=1536	# Self-shadow map size in texels (orthographic, fitted to the mesh each frame; 256-4096)
selfShadowStrength=1.0	# Y = lerp(1, map, strength); Y switches the shadowed texels to the toon shadow colour like the ramp's own terminator
selfShadowBias=0.006,0.004	# Receiver offset toward the light and along the normal (blocks), scaled by 1 - clamp(N.L, 0, 0.9) (EndfieldMainSelfShadowMask.usf)
selfShadowSoftness=1.0	# Self-shadow 4x4 filter tap spacing in map texels
depthPrepass=true	# Write her depth into the shader pack's gbuffer depth so its SSAO and contact shadows see her (ground AO at her feet); needs Oculus with a pack
translucentSeeThrough=0.8	# With the depth prepass: where glass or water lies in front of her she is drawn at this opacity over the pack's translucent image (the pack's translucent layer cannot be re-applied on top)
ambientOcclusion=1.0	# Strength of the scene-consistent AO on her ambient light: the pack's own SSAO (Bliss composite.fsh SSAO, 7 taps on depthtex1) evaluated for her pixels; 0 = off
aoCurve=2.0	# Exponent on the AO before it scales her ambient (Bliss uses pow(SSAO, 6) on temporally denoised AO; on her single-frame AO 6 darkened the whole figure and showed tap patterns, 2 keeps contact AO only)
characterLight=1.0	# CP1.w blend from the sun toward the CharInfo camera-follow key light (pitch >= 32 deg, yaw +12 deg; 0 = sun only)
sunScale=1.0	# Main light intensity at full daylight
netherLight=1.0	# Key light in the Nether and other sky-less dimensions without the End sky (where sky light 0 closed the key): the camera-follow key at this strength x the local lightmap ambient (1 = the overworld noon key-to-ambient ratio; it follows the local light level), no day/night (eye settings and exposure ceiling halfway between night and day); 0 = the 0.8.7 look (ambient only, night settings), live
netherLightColor=0,0,0	# Nether key colour (r,g,b; normalised, netherLight sets the strength); 0,0,0 = the local biome's fog hue (crimson red, warped violet, soul sand teal, basalt grey, wastes red), 60% hue + 40% white, live
endLight=1.0	# Key light in the End (End sky): endLightColor at this strength x the local lightmap ambient (1 = the overworld noon key-to-ambient ratio) from the shader pack's light direction (its shadow matrices), without a pack from a fixed oblique direction (53 deg up); no day/night (eye settings and exposure ceiling halfway); 0 = the 0.8.7 look, live
endLightColor=0.72,0.62,1.0	# End key colour (r,g,b; normalised, endLight sets the strength): a cool purple, live
fillLight=0.6	# Virtual fill light for dark scenes (night, caves): a point light 1.75 blocks from a FULL character's head on the camera side (yaw +12 deg, at least 30 deg up), shaded like the local lights (Type0, face SDF), unshadowed. Lit-side luminance fillLight x clamp((fillTarget - L) / fillTarget, 0, 1) x fillTarget, L = her light level (key + 0.35 ambient where the key reaches, else ambient: the adaptation measure); the eye adaptation counts it too. Takes a local-light slot only when one is free (localLightCount < 4 or fewer than 4 blocks found); 0 = off, live
fillTarget=0.5	# Light level below which the fill light starts (clear noon 1.34, sunset ~0.6, clear night ~0.33, unlit cave 0): daylight gets no fill, live
fillColor=0.92,0.96,1.0	# Fill light colour (r,g,b; normalised to luminance 1): neutral, slightly cool, live
ambientScale=1.0	# Lightmap ambient multiplier
lightScale=1.0	# CP0.y direct-light multiplier
shadowScale=1.0	# CP0.z shadow albedo / minimum lit factor
shadowAmbScale=1.0	# CP0.w shadow-side ambient multiplier
ambToWhite=1.0	# CP1.y lit side: ambient hue -> white
ndotlBias=0.0	# CP11.w*CP12.x N.L bias before the ramp
backlight=1.0	# 1-CP12.x back-light wrap / dark-silhouette lift
specScale=1.0	# CP13.w specular multiplier
rimColor=1.0,1.0,1.0	# CP8.rgb rim colour
rimIntensity=0.35	# CP8.a rim intensity
rimScreenDir=0.3,1.0	# CP9.xy rim offset; rim axis = cross(camBack, offset) = (-y, x): (0.3,1) puts the rim on the screen-left edges as in refs 14/16 (negating it is the same as swapping the cross order)
rimAlbedo=0.5	# CP9.z rim tinted by albedo
rimWidth=0.5	# CP9.w rim width
rimDepth=true	# Hair rim gated by screen-space depth like the game's opaque hair (H asm 1353-1377): the scene depth rimWidth x 0.006 of the screen height away along the screen normal must lie rimDepthRange blocks behind the pixel, so the rim lights the silhouette against what is behind it and never the inside of the hair; needs her depth prepass under a shader pack (otherwise, and with false, the 1 - |N.V| angle gate)
rimDepthRange=0.1,0.2	# rimDepth smoothstep range of the depth difference in blocks (0.1, 0.2 m in the game)
sdfBias=0.0	# CP16.w face SDF threshold bias
outlineScale=1.0	# Multiplier on every model's outline widths
normalMapStrength=1.0	# Multiplier on every material's _BumpScale / _SpecBumpScale (normal maps and the hair split normal of the model package's materials data; 0 = off, the mesh normal)
useShadowLut=true	# Skin/face/brow shadow colour from the model package's skin LUT (read V-flipped: PNG rows are top-down, Unity GPU rows bottom-up)
overlay=true	# Draw the model package's OverlayShadow layers (eye-white shadow, eyeshadow, bangs shadow) multiplied over the face
overlayGameOrder=true	# The OverlayShadow layers multiply the colour before the tonemap, as in the game (its overlay pass draws into the HDR scene colour; ours lands on the displayed colour): the body pass stores its pre-tonemap luminance in the receiver target and each layer applies tone(Y x layer) / tone(Y). Lighter in bright light, e.g. at noon the eye-white shadow 0.33 -> 0.75, the eyelid shadow over the iris 0.37 -> 0.43, the bangs shadow on the face 0.75 -> 0.94; about the same in the dark; false = 0.8.10, live
faceCrackFill=true	# Fill crack pixels in faces (an unwelded seam showing hair, the head's inside, the outline shell or the sky) with the surrounding face colour: a non-face, non-eye pixel with face pixels within 2 px in at least 6 of 8 directions, each nearer than it by more than faceCrackDepth; needs GL 4.5 / a texture barrier
faceCrackDepth=0.003	# faceCrackFill: how much farther than the face around it (view-space blocks, 0.003 = 3 mm) a pixel must be to count as a crack; lashes, the lip line and highlights lie in front of or level with the face and are never filled
clothDepthBias=0.01	# How much nearer the camera cloth (the class map's cloth, accessories included; not skin, face, hair or eyes) is depth-tested, in blocks along its own view ray, so it covers the same pixels: skin that pokes up to this far through the clothes stays hidden (in the anti-clip harness 99% of garment vertex-frames lie less than 0.8 cm inside the body). Too large and fingers resting on clothes get covered; 0 = off, live
fpArms=true	# First-person arms (the arm model of a humanoid-import YSM model, TACZ hand poses included) drawn with the NPR shading of the model's package instead of YSM's toon look or the shader pack's lighting: under a pack after its final pass, depth-tested against the held item, without one in vanilla's hand pass; antialiased like a close-up (antiAliasing), no self-shadow, overlay layers or scene AO on them; false = YSM draws them as before, live
fpArmsOutline=1.0	# Width factor of the outline shell on the first-person arms (on top of outlineScale; with the hand's 70 deg projection the shell is about 1.5-3 px at 1080p: it stays constant in NDC up to ~0.36 blocks from the eye, then thins); 0 = no outline on the arms, live
fpArmsSceneShadow=true	# The shader pack's sun shadows (sceneShadow) on the first-person arms, read where the arms are in front of the eyes (her own head and body, within sceneShadowSelfDistance, are skipped); false = the arms ignore them, live
localLights=true	# Light-emitting blocks near a FULL character (torches, lanterns, glowstone, lava...) shade her as the game's NPR local lights (Type0 Default: lit side vs back contrast 0.25 cloth/hair/eye, 0.5 skin/face) with the share localLightShare of the lightmap's block light taken out of her ambient, so the average brightness stays the same
localLightShare=0.75	# Share of the lightmap's block light (the part the found lights explain) re-aimed from the ambient at the light blocks (0 = ambient only; 1 = all of it: cave contrast lit/dark 3.5 on cloth, 1.9 on skin at a torch 1 block away)
localLightIntensity=1.0	# Multiplier on the local lights (1 = energy-neutral: averaged over all normals they return exactly the ambient they took)
localLightSpecular=1.0	# Multiplier on the local lights' GGX highlight (cloth, skin, face; the game's specular intensity P7.z)
localLightCount=4	# Most local lights per character (0-4; the strongest at her eyes that she can see)
localLightRadius=8	# Scan radius in blocks around her eyes (1-15; a box of (2r+1)^3 blocks, only chunk sections whose palette holds an emitter are read)
localLightRefresh=4	# Rescan a character's lights every this many ticks (and at once when her eyes move more than a block)
materialMaps=true	# A/B switch for the model package's per-material maps (materials.*.maps: property/gloss, emission, hair line, normal and split normal, outline mask, brow mask, cloth parallax): false = drawn as if the package had none (per-class constants, generic outline widths, no brow reveal), live
hairGlossFallback=0.6	# Hair _MetallicGlossMap.G stand-in for models whose package has no prop map and sets no hairSpecMask (scales the primary Kajiya highlight and its RS lookup; Endfield's hair RS ramps are black below u = 0.52, so <= 0.5 means no primary highlight). 0.6: 1.5x the energy, 0.33x the peak of Pelica's real map (tools/hair_gloss_eval.py)
emissionScale=1.0	# Multiplier on the package's per-material emission (_EmissionMap x _EmissionColor x _EmissionBrightness); 0 = off
propMetal=1.0	# Multiplier on the cloth _MetallicGlossMap R (metal) of the model package (0 = no metal; only materials drawn by the game's cloth shader), live
propShadowWeight=1.0	# How much the _MetallicGlossMap B (property shadow weight: receiver x B, lit = min(.., B), H2 1601-1602) darkens hair and cloth: 1 = as in the game, 0 = ignored, live
envReflection=1.0	# Cloth environment reflection (the game's cube IBL x EnvBRDF, Gens2_11058832 1895-1927) with the light reaching the surface standing in for the reflection probe; lights metal cloth (_MetallicGlossMap R), which is otherwise black; 0 = off, live
mapResolution=2048	# Largest side of the composited per-material map layers (atlas-aligned array, one layer per map group); applies to packages loaded afterwards
mapBudgetMB=48	# GPU budget per model for the per-material maps (layers with mipmaps + tiled sheet); the layer resolution drops until they fit; applies to packages loaded afterwards
mapCacheMB=256	# Disk cache of the composited per-material maps (.ysm/endfield_npr/cache in the game directory), so a model loaded again skips its map PNG decodes and compositing; least recently used entries go beyond this size (about 2-6 MB per model); 0 = off
rainEffect=true	# Endfield character rain and wetness: the game's wet darkening, drops, streaks and face drips (HGRP/CharacterNPR, _Skin, _Hair) driven per character by Minecraft's rain where her head is rained on (sky visible, a raining biome, not snow), wading and swimming; live
rainStrength=1.0	# Multiplier on the instant rain (byte 0: animated drops, streaks, face drips), live
wetStrength=1.0	# Multiplier on the accumulated wetness (byte 2: wet darkening, patches, glossier cloth), live
wadeStrength=1.0	# Multiplier on the water-line wetness (byte 1: wet below the water line after wading), live
rainSmoothTime=0.5	# Time constant (s) of the instant rain when the rain on her head starts or stops (stepping under a roof)
wetDrenchTime=30	# Time constant (s) of getting wet in full rain (divided by the rain level); ours, the game's rainIntensityToDrenchSmoothTimeCurve is not in any asset we have
wetMax=1.0	# Most wetness reached in rain, times the rain level (ours, for the game's rainIntensityToMaxWetnessCurve)
wetDryDelay=20	# Seconds out of the rain (or the water) before she starts to dry (ours, for dryDrenchedAfterSeconds)
wetDrySmoothTime=60	# Time constant (s) of drying (ours, for dryDrenchedSmoothTime)
rainTiling=5	# Rain texture tiling per block (the shaders' cb1[120].z): size of the drops, wet patches and streaks on body, hair and cloth; 5 = the size chosen in the first in-game rain test, 2.2x smaller than the game's HGRainPresettingAsset characterRainTextureTiling 2.25; live
rainDebug=-1,0,0,0,-1	# Debug override like the game's global cb1[120]: four bytes 0-255 (instant rain, water-line wetness, wetness, snow) and the water line above the feet in blocks (< 0 = none) for every character, optionally a sixth value: the drip after the water (ours, 0-1; > 0 = forced, else off so the bytes show the game's response alone); first value < 0 = off, live
rainGlint=1.0	# Strength of the drop glints on skin and hair (the light x glint term of Skin 1185-1214 / Hair 1273-1304); the wet sheen weights stay; 1 = as the game, 0 = off, live
rainMatcap=1.0	# Strength of the face's wet matcap highlight (rain_04 A sampled by the view-space normal, Skin 770-789); 1 = as the game, 0 = off, live
rainDropSpeed=3.0	# Speed of every drop and streak (body, hair, cloth and the face drips) relative to the game (1 = the game's _Time.x pace, which looks almost still; 3 = a drop appears and fades in about 2 s on the body), live
rainFaceDripSpeed=1.0	# Extra speed factor of the face drips on top of rainDropSpeed (1 = the same speed as the body), live
rainDropDensity=0.5	# Ours: share of the drops kept on skin, hair and cloth on top of the game's wetness threshold; each drop keeps a fixed random value of its grid cell and is culled whole; the cloth's texture drops and streaks are thinned by a low-frequency mask instead (no visible tile repeat); 1 = the game's drops, live
rainDropJitter=1.0	# Ours: position and size jitter of the procedural drops on skin, hair and cloth (0 = the game's layout, +-0.25 cell and fixed sizes; 1 = anywhere the drop fits whole in its cell, size x0.7-1.3), live
rainDropSpeedJitter=0.4	# Ours: per-drop random speed of the procedural drops in falling rain, +- this share of rainDropSpeed (0.4 = 0.6-1.4x; 0 = all at one speed as in the game), live
rainDropSlide=0.05	# Ours: in falling rain the procedural drops of skin, hair and cloth slide down the body at this speed in blocks per second (each column of drops x0.6-1.4 with rainDropSpeedJitter), growing in and shrinking away over their life; 0 = the game's drops, which appear and fade in place, live
rainSheen=1.0	# Strength of the specular sheen of skin and hair in rain: the game's skin GGX (Skin 1168-1184, on the normal from before the drops) and hair primary highlight (Hair 1240-1261) that the wet block weights, times this as the game's _CharacterParams13.w (value unknown, 1 assumed; specScale applies as well); live
rainWetReflection=1.0	# Ours, not the game's: a water-film reflection on wet skin and hair (the light reaching the surface x EnvBRDF of water, F0 0.02, roughness 0.15, x wetness), standing in for the game's separate reflection pass (SSR / probes) that its character programs only feed a wet flag; 0 = off, live
waterDrip=1.0	# Ours: the drips after the water. Once she rises out of it (leaves it, or it drops a quarter block below her wet line) the skin the water wetted gets rain of this strength (0-1): the drops run and slide and the face drips flow as in rain, thinning out to none over waterDripTime; there the drops never freeze (the game's still drops stay for rain only); 0 = off (still drops after wading and swimming, as 0.8.12), live
waterDripTime=20	# Seconds the drips after the water take to fade from waterDrip to none (linear; the drops are gone after about 7/8 of it), live
waterLineHold=true	# Ours: the wet line stays at the highest water of the wet spell (walking out no longer drags it down to her feet) and covers all of her once her eyes were under water, until she is dry; false = the line is the water surface of her last tick in the water (0.8.12), live
